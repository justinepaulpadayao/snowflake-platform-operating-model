name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: SQLFluff lint — catch syntax errors in SQL before they reach
  # Snowflake.  Snowflake-dialect linting is the only static gate that can
  # prevent a bad RBAC or audit query from being deployed.
  # --------------------------------------------------------------------------
  lint-sql:
    name: SQLFluff lint (Snowflake dialect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint RBAC model
        # --ignore parsing: CREATE RESOURCE MONITOR is valid Snowflake DDL not
        # yet in SQLFluff's grammar; PRS false positives are suppressed here.
        run: sqlfluff lint --dialect snowflake --ignore parsing rbac/

      - name: Lint audit queries
        run: sqlfluff lint --dialect snowflake audit/

      - name: Lint security policies and alerts
        # --ignore parsing: ALERT, SESSION POLICY, and NOTIFICATION INTEGRATION
        # are valid Snowflake Enterprise DDL not yet in SQLFluff's grammar.
        # PRS (parse) errors for those statements are false positives; lint rules
        # are still enforced on the parsable sections.
        run: sqlfluff lint --dialect snowflake --ignore parsing security/

  # --------------------------------------------------------------------------
  # Job 2: Unit tests for access_review.py.
  # The reconcile and build_expected functions drive every revoke decision;
  # a logic regression here is a direct HIPAA risk.
  # --------------------------------------------------------------------------
  test:
    name: pytest — access review unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pyyaml

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # --------------------------------------------------------------------------
  # Job 3: Terraform — validate syntax and formatting of the IaC layer.
  # Does not authenticate to Snowflake; validates HCL only.
  # Uses synthetic variable values so the provider can be initialized
  # without real credentials.
  # --------------------------------------------------------------------------
  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    env:
      # Synthetic values — only needed to satisfy provider variable declarations
      # during `terraform validate` (no API calls are made).
      TF_VAR_snowflake_org:         "validate-only"
      TF_VAR_snowflake_account:     "validate-only"
      TF_VAR_snowflake_private_key: "validate-only"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize providers (syntax check only, no backend)
        run: terraform -chdir=infra init -backend=false

      - name: Validate HCL syntax
        run: terraform -chdir=infra validate
